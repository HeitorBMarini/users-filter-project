<!-- Botão para abrir o Sidebar (aparece apenas quando o sidebar está fechado) -->
<button *ngIf="!isSidebarOpen" (click)="toggleSidebar()" type="button" class="inline-flex items-center p-2 mt-2 ms-3 text-sm text-gray-500 rounded-lg  hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600">
    <span class="sr-only">Open sidebar</span>
    <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <path clip-rule="evenodd" fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"></path>
    </svg>
</button>

<!-- Sidebar (aparece apenas quando `isSidebarOpen` for `true`) -->
<aside *ngIf="isSidebarOpen" class="fixed top-0 right-0 z-40 w-100 h-screen transition-transform bg-gray-50 dark:bg-gray-800" aria-label="Sidebar">
    <div class="h-full px-3 py-4 overflow-y-auto">
        <div class="flex justify-between items-center">
            <h2 class="text-3xl text-white">Detalhes do Usuário</h2>
            <!-- Botão para fechar o Sidebar -->
            <button (click)="toggleSidebar()" type="button" class="mr-5">
                <span class="sr-only">Close sidebar</span>
                <svg class="w-6 h-6" aria-hidden="true" fill="white" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path clip-rule="evenodd" fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"></path>
                </svg>
            </button>
        </div>
        <ul class="space-y-2 font-medium mt-6">
            <li class="w-full px-4 py-2 border-b text-white border-gray-200 rounded-t-lg dark:border-gray-600">Profile</li>
            <li class="w-full px-4 py-2 border-b text-white border-gray-200 dark:border-gray-600">Settings</li>
            <li class="w-full px-4 py-2 border-b text-white border-gray-200 dark:border-gray-600">Messages</li>
        </ul>
    </div>
</aside>
